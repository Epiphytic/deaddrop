[package]
name = "marmot-wasm-probe"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cgka-engine = { git = "https://github.com/Epiphytic/mdk.git", rev = "4981e591bd9399fdad6d5bf62ce6eafa70da7d0b" }
cgka-traits = { git = "https://github.com/Epiphytic/mdk.git", rev = "4981e591bd9399fdad6d5bf62ce6eafa70da7d0b" }
transport-nostr-peeler = { git = "https://github.com/Epiphytic/mdk.git", rev = "4981e591bd9399fdad6d5bf62ce6eafa70da7d0b" }
openmls = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["extensions-draft"] }
openmls_memory_storage = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["extensions-draft"] }
openmls_traits = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada", features = ["extensions-draft"] }
parking_lot = "0.12"
postcard = { version = "1.1", features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen = "0.2.125"
zeroize = "1.8"

[dev-dependencies]
serde_json.workspace = true
