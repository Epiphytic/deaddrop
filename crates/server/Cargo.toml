[package]
name = "deaddrop-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "deaddrop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
deaddrop-relay-core = { path = "../relay-core" }
deaddrop-relay-sqlite = { path = "../relay-sqlite" }
futures = "0.3"
fs2 = "0.4"
getrandom = "0.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
hypertor = { version = "=0.3.0", default-features = false, features = ["server", "rustls", "static-sqlite"] }
nostr.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
deaddrop-protocol-core = { path = "../protocol-core" }
hypertor = { version = "=0.3.0", default-features = false, features = ["client", "ws", "rustls", "static-sqlite"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3.20"
tokio-tungstenite = { version = "0.28", features = ["connect"] }
