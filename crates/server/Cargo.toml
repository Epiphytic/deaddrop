[package]
name = "deaddrop-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "deaddrop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
deaddrop-relay-core = { path = "../relay-core" }
deaddrop-relay-sqlite = { path = "../relay-sqlite" }
futures = "0.3"
getrandom = "0.3"
nostr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
base64.workspace = true
deaddrop-protocol-core = { path = "../protocol-core" }
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3.20"
